<!DOCTYPE html>
<html>
<head>
    <title>Python Expense Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 30px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        form { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select, button { padding: 10px; font-size: 14px; }
        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: left; }
        th { background-color: #e9ecef; }
        .total-box { background: #e2e3e5; padding: 12px; font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Online Expense Tracker</h2>
        <form method="POST" action="/">
            <input type="text" name="title" placeholder="Expense Title" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount ($)" required>
            <input type="text" name="category" placeholder="Category (e.g. Food)">
            <button type="submit">Add Expense</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                {% for item in expenses %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.title }}</td>
                    <td>{{ item.category }}</td>
                    <td>${{ "%.2f"|format(item.amount) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="total-box">
            Total Spent: ${{ "%.2f"|format(total) }}
        </div>
    </div>
</body>
</html>
