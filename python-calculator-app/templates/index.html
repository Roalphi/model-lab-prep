<!DOCTYPE html>
<html>
<head>
    <title>Python Calculator</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        .result { background: #f0f0f0; padding: 10px; margin-top: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Python Web Calculator</h2>
    <form method="POST" action="/">
        <input type="number" step="any" name="num1" placeholder="Enter First Number" required>
        <select name="operation">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        <input type="number" step="any" name="num2" placeholder="Enter Second Number" required>
        <button type="submit">Calculate</button>
    </form>

    {% if result is not none %}
    <div class="result">Result: {{ result }}</div>
    {% endif %}
</body>
</html>
